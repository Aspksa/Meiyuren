name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:launcher
      - run: python -m pytest backend/tests -q
      - run: npm run build

  windows-check:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend\requirements-dev.txt
      - run: npm run typecheck
      - run: npm run test:launcher
      - run: python -m pytest backend\tests -q
      - run: npm run build
